[package]
name = "ffmpeg-sys"
version = "0.1.0"
edition = "2021"
description = "Raw FFI bindings to FFmpeg/libav libraries"
publish = false

[lib]
name = "ffmpeg_sys"
path = "src/lib.rs"
# The generated bindings carry FFmpeg's C doc comments, which rustdoc would
# try (and fail) to compile as Rust examples.
doctest = false

[dependencies]
libc = "0.2"

[build-dependencies]
bindgen = "0.70"
pkg-config = "0.3"
