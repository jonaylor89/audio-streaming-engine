name: CodSpeed

on:
  push:
    branches:
      - "main"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      - name: Install FFmpeg 8.1 (required for audio processing)
        # Prebuilt shared libraries + headers matching the Docker image's
        # FFmpeg; Ubuntu's packaged FFmpeg (6.1) is too old for this project.
        run: |
          name=ffmpeg-n8.1-latest-linux64-gpl-shared-8.1
          curl -sSfL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$name.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "FFMPEG_DIR=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/$name/lib" >> "$GITHUB_ENV"

      - name: Build the benchmark target(s)
        run: cargo codspeed build

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v3
        with:
          run: cargo codspeed run
          token: ${{ secrets.CODSPEED_TOKEN }}
